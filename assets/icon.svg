  <polygon points="100,272 84,244 116,244" fill="#fda085"/>
  
  <!-- Center Glow Node -->
  <circle cx="256" cy="240" r="28" fill="#ffffff" filter="drop-shadow(0px 0px 8px rgba(0,242,254,0.8))"/>
  <circle cx="256" cy="240" r="14" fill="#0f2027"/>
